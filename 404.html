<title>찾는 쪽이 없다</title>
<style>
:root{--bg:#fcf3e8;--ink:#29211a;--soft:#635346;--accent:#b0553a;--line:#ede0cf}
@media (prefers-color-scheme:dark){:root{--bg:#1b1610;--ink:#f2e7de;--soft:#b4a599;--accent:#ef9468;--line:#3a3229}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:var(--bg);color:var(--ink);padding:24px;line-height:1.75;letter-spacing:-.011em;
 font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;word-break:keep-all}
.box{max-width:30rem;text-align:center}
h1{font-size:26px;margin:0 0 12px;letter-spacing:-.02em}
p{margin:0 0 22px;color:var(--soft)}
a{display:inline-block;margin:0 6px;padding:10px 18px;border-radius:999px;
 border:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:700}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
